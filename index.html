
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Heart 💙</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #060208;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

canvas {
  display: block;
  width: min(100vw, 800px);
  height: auto;
  max-height: 100dvh;
  aspect-ratio: 1 / 1;
  object-fit: contain;
}
</style>
</head>

<body>
<canvas id="love"></canvas>

<script>
const canvas = document.getElementById("love");
const ctx = canvas.getContext("2d");

const BG = "#060208";
const SC = 21;
const OY = 20;
const DURATION = 10;
const LIFT = 34;

const PHRASES = [
  "I love you",
  "Seni seviyorum",
  "Te amo",
  "Je t'aime",
  "Ich liebe dich",
  "Ti amo",
  "Eu te amo",
  "Я тебя люблю",
  "사랑해",
  "愛してる",
  "我爱你",
  "मी तुझ्यावर प्रेम करते",
  "म्हैं थाने प्यार करूं",
  "Σ' αγαπώ",
  "Ik hou van jou",
  "Jag älskar dig",
  "Kocham cię",
  "ฉันรักเธอ",
  "Anh yêu em",
  "Aku cinta kamu",
  "Я тебе кохаю"
];

const rng = (() => {
  let seed = 11;
  return () => {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  };
})();

const powder = [176, 224, 230];
const turquoise = [64, 224, 208];
const maya = [115, 194, 251];
const flash = [224, 250, 255];

function mix(a, b, k) {
  return a.map((v, i) => v + (b[i] - v) * k);
}

function color(c, alpha = 1) {
  return `rgba(${c.map(v => Math.round(v)).join(",")},${alpha})`;
}

function heart(a) {
  return {
    x: 16 * Math.pow(Math.sin(a), 3) * SC,
    y: (
      13 * Math.cos(a)
      - 5 * Math.cos(2 * a)
      - 2 * Math.cos(3 * a)
      - Math.cos(4 * a)
    ) * SC + OY
  };
}

const polygon = Array.from({length: 720}, (_, i) => {
  const p = heart(2 * Math.PI * i / 720);
  return {x: 400 + p.x, y: 400 - p.y};
});

const edges = polygon.map((p, i) => [
  p, polygon[(i + 1) % polygon.length]
]);

function spans(y) {
  const xs = [];

  for (const [a, b] of edges) {
    if ((a.y <= y && y < b.y) ||
        (b.y <= y && y < a.y)) {
      xs.push(
        a.x + (y - a.y) * (b.x - a.x) / (b.y - a.y)
      );
    }
  }

  xs.sort((a, b) => a - b);

  const result = [];
  for (let i = 0; i + 1 < xs.length; i += 2) {
    result.push([xs[i], xs[i + 1]]);
  }
  return result;
}

function intersects(A, B) {
  const out = [];

  for (const a of A) {
    for (const b of B) {
      const lo = Math.max(a[0], b[0]);
      const hi = Math.min(a[1], b[1]);

      if (hi - lo > 14) out.push([lo, hi]);
    }
  }

  return out;
}

function font(size) {
  return `bold ${size}px Arial, sans-serif`;
}

function buildHeart() {
  const items = [];
  const rowH = 18;
  let phraseIndex = 0;

  function nextPhrase() {
    const value = PHRASES[phraseIndex % PHRASES.length];
    phraseIndex++;
    return value;
  }

  for (let y = 105 + rowH / 2; y < 740 - rowH / 2; y += rowH) {
    const rows = intersects(
      spans(y - rowH / 2),
      spans(y + rowH / 2)
    );

    for (const [left, right] of rows) {
      const lo = left + 4;
      const hi = right - 4;

      let cursor = lo + rng() * 8;
      const line = [];

      while (cursor < hi - 20) {
        let fit = null;

        for (let tries = 0; tries < 15; tries++) {
          const text = nextPhrase();
          const size = [11, 12, 13, 14][
            Math.floor(rng() * 4)
          ];

          ctx.font = font(size);
          const w = ctx.measureText(text).width;

          if (cursor + w <= hi) {
            fit = {text, size, w};
            break;
          }
        }

        if (!fit) break;

        line.push({
          x: cursor + fit.w / 2,
          y,
          text: fit.text,
          size: fit.size,
          w: fit.w
        });

        cursor += fit.w + 7;
      }

      if (!line.length) continue;

      if (line.length === 1) {
        line[0].x = (lo + hi) / 2;
      } else {
        const used = line[line.length - 1].x
          + line[line.length - 1].w / 2;
        const extra = Math.max(0, hi - used);

        line.forEach((p, i) => {
          p.x += extra * i / (line.length - 1);
        });
      }

      line.forEach((p, i) => {
        p.edge = i === 0 || i === line.length - 1;

        const dx = (p.x - 400) / (16 * SC);
        const dy = (p.y - 400) / (14.5 * SC);
        p.rad = Math.min(1, Math.hypot(dx, dy));

        let base = mix(
          powder,
          turquoise,
          0.25 + 0.75 * p.rad
        );

        base = mix(
          base,
          maya,
          rng() * 0.35 + (p.edge ? 0.3 : 0)
        );

        p.c = base.map(v => Math.min(255, v));
        p.dx = (rng() * 20) - 10;
      });

      items.push(...line);
    }
  }

  const outer = items.filter(p => p.edge);
  const inner = items.filter(p => !p.edge);

  outer.sort((a, b) =>
    Math.atan2(a.x - 400, a.y - 400) -
    Math.atan2(b.x - 400, b.y - 400)
  );

  inner.sort((a, b) =>
    b.rad - a.rad + (rng() - 0.5) * 0.08
  );

  return [...outer, ...inner];
}

let items = [];

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const size = Math.min(window.innerWidth, 800, window.innerHeight);

  canvas.style.width = size + "px";
  canvas.style.height = size + "px";
  canvas.width = Math.round(size * dpr);
  canvas.height = Math.round(size * dpr);

  ctx.setTransform(
    canvas.width / 800, 0,
    0, canvas.height / 800,
    0, 0
  );

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
}

function drawItem(p, progress, time) {
  const u = Math.max(0, Math.min(1, progress));
  const e = 1 - Math.pow(1 - u, 3);

  const x = p.x + p.dx * (1 - e);
  const y = p.y - LIFT * (1 - e);

  ctx.font = font(p.size);

  // Dark text shadow
  ctx.fillStyle = BG;
  ctx.fillText(p.text, x + 2, y + 3);

  // Soft blue halo
  ctx.shadowColor = color(p.c, 0.9);
  ctx.shadowBlur = 2 + 7 * e;
  ctx.fillStyle = color(p.c, 0.2 + 0.35 * e);
  ctx.fillText(p.text, x, y);
  ctx.shadowBlur = 0;

  // Glitter flash
  const flashProgress = Math.max(0, Math.min(
    1, (u - 0.55) / 0.45
  ));

  const glitter = 0.75 * Math.sin(Math.PI * flashProgress);
  const shimmer = Math.max(
    0,
    Math.sin(time * 0.0025 + p.x * 0.06 + p.y * 0.04)
  ) * 0.18;

  const base = mix([6, 2, 8], p.c, Math.pow(e, 1.5));
  const bright = mix(base, flash, Math.min(0.9, glitter + shimmer));

  ctx.fillStyle = color(bright);
  ctx.fillText(p.text, x, y);
}

let startTime = performance.now();

function frame(now) {
  const time = now - startTime;

  ctx.clearRect(0, 0, 800, 800);
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, 800, 800);

  const count = items.length;
  const interval = DURATION * 1000;
  const progressAll = Math.min(1, time / interval);

  // Reveal phrases progressively
  for (let i = 0; i < count; i++) {
    const delay = (i / Math.max(1, count)) * interval;

    if (time < delay) continue;

    const progress = Math.min(1, (time - delay) / 700);
    drawItem(items[i], progress, now);
  }

  requestAnimationFrame(frame);
}

function init() {
  resize();
  items = buildHeart();
  startTime = performance.now();
  requestAnimationFrame(frame);
}

window.addEventListener("resize", resize);
init();
</script>
</body>
</html>
